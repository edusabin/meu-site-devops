name: Pipeline DevOps Aula

on:
  push:
    branches: [ "main" ]

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Listar arquivos
        run: ls -la

  validation:
    name: Validação
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Verificar index.html
        run: |
          if [ ! -f index.html ]; then
            echo "Erro: index.html não encontrado!"
            exit 1
          fi
      - name: Validação concluída
        run: echo "Arquivo OK"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Criar artefato
        run: |
          mkdir dist
          cp index.html dist/
      - name: Verificar dist
        run: ls -la dist

      # Passo opcional para salvar o artefato para o Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    name: Deploy para GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
