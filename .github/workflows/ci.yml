name: Pipeline DevOps Aula
on:
  push:
    branches:
      - main

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Listar arquivos
        run: ls -la

  validation:
    name: Validação
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Validação concluída
        run: echo "Arquivo OK"

  build:
    name: Build (simulado)
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

  deploy:
    name: Deploy (informativo)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        run: echo "Cloudflare fará deploy automaticamente"
